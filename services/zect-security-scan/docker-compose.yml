# ZECT Security Scan — malware daemon for ZECT Security Agent
# Product name: ZECT Security Scan. License attribution: THIRD_PARTY_NOTICES.md only.
services:
  zect-security-scan:
    image: clamav/clamav:1.4
    container_name: zect-security-scan
    ports:
      - "3310:3310"
    volumes:
      - zect_security_scan_db:/var/lib/clamav
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 2 127.0.0.1 3310 | grep -q PONG || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s

volumes:
  zect_security_scan_db:
